[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "devflow-temporal"
version = "0.1.0"
description = "Experimental local Temporal runtime for Devflow"
requires-python = ">=3.12,<3.14"
dependencies = [
  "agent-runtime-kit[codex]==0.5.2",
  "temporalio>=1.20,<2",
]

[project.scripts]
devflow-temporal = "devflow_temporal.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/devflow_temporal"]

[tool.uv]
exclude-newer = "2026-09-25T23:59:59Z"
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

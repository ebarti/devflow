name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: macos-latest
    # Mac installer checks passed, but the job exceeded its former two-minute deadline.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: sh scripts/check-install.sh
  test:
    runs-on: macos-latest
    # The passing Mac source tests took 122.123s before setup and cleanup.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Authentic published installer fixtures require historical Git objects.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python3.12 -B -m unittest discover -s tests -v
  temporal-runtime-macos:
    runs-on: macos-latest
    # The composed suite reached 84% before the observed 30-minute job timeout.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.21.1'
      - uses: temporalio/setup-temporal@1059a504f87e7fa2f385e3fa40d1aa7e62f1c6ca # v0
        with:
          version: '1.9.1'
      - run: temporal --version
      - run: python -m venv "$RUNNER_TEMP/devflow-uv"
      - run: '"$RUNNER_TEMP/devflow-uv/bin/pip" install uv==0.12.17'
      - run: echo "$RUNNER_TEMP/devflow-uv/bin" >> "$GITHUB_PATH"
      - run: uv sync --locked --python python
        working-directory: runtime
      - run: uv run --frozen ruff check src tests
        working-directory: runtime
      - run: uv run --frozen pytest -v --tb=short -ra --durations=20
        working-directory: runtime
  temporal-dashboard:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: runtime/ui/package-lock.json
      - run: npm ci
        working-directory: runtime/ui
      - run: npm run build
        working-directory: runtime/ui
      - run: npm test
        working-directory: runtime/ui

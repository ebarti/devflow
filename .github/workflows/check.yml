name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: macos-latest
    # Mac installer checks passed, but the job exceeded its former two-minute deadline.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: sh scripts/check-install.sh
  test:
    runs-on: macos-latest
    # The passing Mac source tests took 122.123s before setup and cleanup.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Authentic published installer fixtures require historical Git objects.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python3.12 -B -m unittest discover -s tests -v
  temporal-runtime-tests:
    name: runtime shard ${{ matrix.shard }}
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.21.1'
      - uses: temporalio/setup-temporal@1059a504f87e7fa2f385e3fa40d1aa7e62f1c6ca # v0
        with:
          version: '1.9.1'
      - run: temporal --version
      - run: python -m venv "$RUNNER_TEMP/devflow-uv"
      - run: '"$RUNNER_TEMP/devflow-uv/bin/pip" install uv==0.12.17'
      - run: echo "$RUNNER_TEMP/devflow-uv/bin" >> "$GITHUB_PATH"
      - run: uv sync --locked --python python
        working-directory: runtime
      - run: uv run --frozen ruff check src tests runtime_ci.py
        working-directory: runtime
      - run: uv run --frozen python runtime_ci.py --index ${{ matrix.shard }} --count 4
        working-directory: runtime
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: runtime-shard-${{ matrix.shard }}
          path: runtime/ci-results/
          if-no-files-found: error
  temporal-runtime-macos:
    # Preserve the required context and fail closed on missing/failed shards.
    if: ${{ always() }}
    needs: temporal-runtime-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every runtime shard to pass
        env:
          SHARDS_RESULT: ${{ needs.temporal-runtime-tests.result }}
        run: test "$SHARDS_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runtime-shard-*
          path: runtime/ci-results/
          merge-multiple: true
      - name: Verify complete and disjoint coverage at this revision
        run: python runtime/runtime_ci.py --verify runtime/ci-results --count 4
  temporal-dashboard:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: runtime/ui/package-lock.json
      - run: npm ci
        working-directory: runtime/ui
      - run: npm run build
        working-directory: runtime/ui
      - run: npm test
        working-directory: runtime/ui

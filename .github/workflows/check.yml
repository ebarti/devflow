name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh scripts/check-install.sh
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3.12 -B -m unittest discover -s tests -v
  temporal-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3.12 -m venv /tmp/devflow-uv
      - run: /tmp/devflow-uv/bin/pip install uv==0.12.17
      - run: /tmp/devflow-uv/bin/uv sync --locked --python python3.12
        working-directory: runtime
      - run: /tmp/devflow-uv/bin/uv run --frozen ruff check src tests
        working-directory: runtime
      - run: /tmp/devflow-uv/bin/uv run --frozen pytest -q
        working-directory: runtime

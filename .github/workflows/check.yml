name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  DEVFLOW_CI_FAILURE_DIAGNOSTICS: runner-custody-v1

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Installer and reconcile modules already run on Mac; keep one execution per case.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Authentic published installer fixtures require historical Git objects.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Run the remaining portable source tests
        run: |
          python3.12 -B - <<'PY'
          import sys
          import unittest

          def cases(suite):
              for test in suite:
                  if isinstance(test, unittest.TestSuite):
                      yield from cases(test)
                  else:
                      yield test

          discovered = list(cases(unittest.defaultTestLoader.discover('tests')))
          mac_modules = {'test_reconcile', 'test_production_installation',
                         'test_service_entry_installation',
                         'test_upgrade_installation'}
          native = [test for test in discovered
                    if type(test).__module__ in mac_modules
                    or type(test).__module__.startswith('test_delivery')]
          native_ids = {test.id() for test in native}
          portable = [test for test in discovered if test.id() not in native_ids]
          portable_ids = {test.id() for test in portable}
          assert not native_ids & portable_ids
          assert native_ids | portable_ids == {test.id() for test in discovered}
          assert native_ids and portable_ids
          print(f'Source coverage: {len(native_ids)} Mac + {len(portable_ids)} portable cases')
          result = unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(portable))
          sys.exit(not result.wasSuccessful())
          PY
  temporal-runtime-tests:
    name: runtime shard ${{ matrix.shard }}
    runs-on: macos-latest
    # Hosted Mac throughput varies; a progressing partition timed out at 82% after 30 minutes.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Two Mac hosts each run two partitions; host 0 also qualifies source tests.
      max-parallel: 2
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Host 0's installer fixtures require historical Git objects.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.21.1'
      - uses: temporalio/setup-temporal@1059a504f87e7fa2f385e3fa40d1aa7e62f1c6ca # v0
        with:
          version: '1.9.1'
      - run: temporal --version
      - run: python -m venv "$RUNNER_TEMP/devflow-uv"
      - run: '"$RUNNER_TEMP/devflow-uv/bin/pip" install uv==0.12.17'
      - run: echo "$RUNNER_TEMP/devflow-uv/bin" >> "$GITHUB_PATH"
      - run: uv sync --locked --python python
        working-directory: runtime
      - name: Prepare exact Python for native location fixtures
        run: |
          uv python install --managed-python 3.12.13
          fixture_python="$(uv python find --managed-python --no-python-downloads 3.12.13)"
          "$fixture_python" -c 'import sys; assert sys.version_info[:3] == (3, 12, 13)'
          printf 'DEVFLOW_TEST_RUNTIME_LOCATION_PYTHON=%s\n' "$fixture_python" >> "$GITHUB_ENV"
      - name: Prepare disposable native SDK and official tool fixtures
        env:
          DEVFLOW_TEMPORAL_GITHUB_TOKEN: ${{ github.token }}
        run: |
          .venv/bin/python tests/portable_temporal_fixture.py "$RUNNER_TEMP/devflow-portable-temporal"
        working-directory: runtime
      - run: uv run --frozen ruff check src tests runtime_ci.py
        working-directory: runtime
      - name: Run assigned runtime modules and host 0 Mac source qualification
        # Four complete, disjoint partitions; at most two pytest parents per host.
        run: |
          result=0
          processes=()
          if [ '${{ matrix.shard }}' = 0 ]; then
            env GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 \
              sh ../scripts/check-install.sh &
            processes+=("$!")
            (
              cd ..
              env GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 \
                python3.12 -B -m unittest discover -s tests -p 'test_reconcile.py' -v
            ) &
            processes+=("$!")
            for process in "${processes[@]}"; do
              wait "$process" || result=1
            done
            processes=()
          fi
          for lane in 0 1; do
            index=$(( ${{ matrix.shard }} + lane * 2 ))
            # Exclude private transient fixtures from ambient metadata indexing.
            .venv/bin/python runtime_ci.py --index "$index" --count 4 \
              --basetemp "$RUNNER_TEMP/devflow-pytest-$index.noindex" &
            processes+=("$!")
          done
          for process in "${processes[@]}"; do
            wait "$process" || result=1
          done
          exit "$result"
        working-directory: runtime
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: runtime-shard-${{ matrix.shard }}
          path: runtime/ci-results/
          if-no-files-found: error
  temporal-runtime-macos:
    # Preserve the required context and fail closed on missing/failed shards.
    if: ${{ always() }}
    needs: [temporal-runtime-tests, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every runtime shard to pass
        env:
          SHARDS_RESULT: ${{ needs.temporal-runtime-tests.result }}
          SOURCE_RESULT: ${{ needs.test.result }}
        run: test "$SHARDS_RESULT" = success && test "$SOURCE_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runtime-shard-*
          path: runtime/ci-results/
          merge-multiple: true
      - name: Verify complete and disjoint coverage at this revision
        run: python runtime/runtime_ci.py --verify runtime/ci-results --count 4
  temporal-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: runtime/ui/package-lock.json
      - run: npm ci
        working-directory: runtime/ui
      - run: npm run build
        working-directory: runtime/ui
      - run: npm test
        working-directory: runtime/ui

name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: sh scripts/check-install.sh
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Authentic published installer fixtures require historical Git objects.
      - run: python3.12 -B -m unittest discover -s tests -v
  temporal-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3.12 -m venv /tmp/devflow-uv
      - run: /tmp/devflow-uv/bin/pip install uv==0.12.17
      - run: echo '/tmp/devflow-uv/bin' >> "$GITHUB_PATH"
      - run: /tmp/devflow-uv/bin/uv sync --locked --python python3.12
        working-directory: runtime
      - run: /tmp/devflow-uv/bin/uv run --frozen ruff check src tests
        working-directory: runtime
      - run: /tmp/devflow-uv/bin/uv run --frozen pytest -q
        working-directory: runtime
  temporal-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: runtime/ui/package-lock.json
      - run: npm ci
        working-directory: runtime/ui
      - run: npm run build
        working-directory: runtime/ui
      - run: npm test
        working-directory: runtime/ui
